<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My México. My Way. · Travel México</title>
<style>
/* Base page shell */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f7f4e9;color:#142f2b;font-family:"DM Sans",Arial,Helvetica,sans-serif;line-height:1.55}
a{color:inherit}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #986a00;outline-offset:3px}
.site-header{padding:25px 5%;display:flex;justify-content:space-between;align-items:center;gap:25px}
.brand{font-size:28px;font-weight:800;text-decoration:none;letter-spacing:-1px;color:inherit}
.brand span{display:block;font-size:9px;letter-spacing:3px;font-weight:700}
@media(max-width:700px){.site-header{padding:18px 5%;align-items:flex-start}.brand{font-size:23px}}

:root {
  interpolate-size: allow-keywords;
}

.mmw-section {
  /* Brand tokens aligned with travelmexico.travel/en/ */
  --mmw-ink: #142f2b;
  --mmw-cream: #f7f4e9;
  --mmw-yellow: #f6ef6d;
  --mmw-orange: #f77849;
  --mmw-bg-card: #ffffff;
  --mmw-panel-mint: #eef4f1;
  --mmw-forest: #142f2b;
  --mmw-forest-dark: #0c1f1c;
  --mmw-forest-btn: #143d36;
  --mmw-coral: #f77849;
  --mmw-coral-light: #fff4ef;
  --mmw-border-card: #e2dfd7;
  --mmw-border-mint: #d7e2dc;
  --mmw-border-input: #cbd5cf;
  --mmw-border-pill: #d0dbd5;
  --mmw-text-muted: #5f746e;
  --mmw-text-main: #142f2b;

  width: min(1200px, 90%);
  margin-inline: auto;
  padding-block: 2rem 4rem;
  color: var(--mmw-ink);
  font-family: 'DM Sans', Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* When placed inside .wrap (e.g. in SiteHome), span 100% of the wrap container without extra margins */
.wrap .mmw-section {
  width: 100%;
  max-width: 100%;
  padding-inline: 0;
  padding-block: 0.5rem 3rem;
}

#my-mexico.section {
  padding-top: 48px;
}

/* ==========================================================================
   Header matching user mockup: The Experience Personalizer / My México. My Way.
   Reset global site `header` / `h1` / `h2` / `p` rules so the stack stays
   left-aligned and vertical (eyebrow → title → lead → guide).
   ========================================================================== */
.mmw-header {
  display: block;
  width: 100%;
  max-width: none;
  margin: 0 0 1.75rem 0;
  padding: 0;
  text-align: left;
}

.mmw-header-eyebrow {
  display: block;
  margin: 0 0 0.65rem 0;
  max-width: none;
  font-family: 'DM Sans', Arial, sans-serif;
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.35;
  text-transform: none;
  color: var(--mmw-ink);
}

.mmw-header h1.mmw-header-title,
.mmw-header-title {
  display: block;
  margin: 0 0 0.85rem 0;
  max-width: none;
  padding: 0;
  font-family: 'Bricolage Grotesque', 'DM Sans', Arial, sans-serif;
  font-size: clamp(2.75rem, 5.5vw, 4rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.045em;
  color: var(--mmw-ink);
}

.mmw-title-primary {
  color: var(--mmw-ink);
  font-weight: 800;
  font-style: normal;
}

.mmw-title-accent {
  color: #008fa3;
  font-weight: 700;
  font-style: italic;
}

.mmw-header-subtitle {
  display: block;
  margin: 0 0 0.7rem 0;
  max-width: 42rem;
  font-family: 'DM Sans', Arial, sans-serif;
  font-size: clamp(1.15rem, 2vw, 1.5rem);
  font-weight: 500;
  line-height: 1.3;
  color: var(--mmw-ink);
  letter-spacing: -0.02em;
}

.mmw-header-guide {
  display: block;
  margin: 0 0 0.25rem 0;
  max-width: 42rem;
  font-family: 'DM Sans', Arial, sans-serif;
  font-size: 0.9375rem;
  line-height: 1.5;
  color: var(--mmw-text-muted);
}

.mmw-marisol-inline-link {
  display: inline;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  font-size: inherit;
  color: #008fa3;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  cursor: pointer;
  font-weight: 600;
  transition: color 150ms ease;
  filter: none;
}

.mmw-marisol-inline-link:hover {
  color: var(--mmw-ink);
  filter: none;
}

.mmw-marisol-inline-link:focus-visible {
  outline: 2px solid #008fa3;
  outline-offset: 2px;
  border-radius: 2px;
}

/* Subtle Interactive Feedback */
.mmw-section :where(button) {
  transition:
    box-shadow 150ms ease-out,
    scale 150ms ease-out,
    background-color 160ms ease,
    border-color 160ms ease,
    color 160ms ease,
    transform 160ms ease;
}

@media (prefers-reduced-motion: no-preference) {
  .mmw-section :where(button:not(:disabled)):active {
    scale: 0.98;
  }
}

.mmw-section :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid CanvasText;
  outline-offset: 3px;
}

/* Visually Hidden Checkbox Inputs */
.mmw-visually-hidden {
  position: absolute;
  clip-path: inset(50%);
  overflow: hidden;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  white-space: nowrap;
}

/* Main Two-Column Split Layout matching user screenshot */
.mmw-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
}

/* ==========================================================================
   LEFT CARD: Visual Stage with Real HD Stock Photography
   ========================================================================== */
.mmw-visual-card {
  background: var(--mmw-bg-card);
  border: 1px solid var(--mmw-border-card);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  position: relative;
}

.mmw-visual-header {
  padding: 14px 20px;
  background: #ffffff;
  border-block-end: 1px solid #ebe7df;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.mmw-visual-eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mmw-forest);
}

.mmw-photo-toggle-btn {
  background: rgba(21, 62, 57, 0.07);
  border: 1px solid rgba(21, 62, 57, 0.16);
  color: var(--mmw-forest);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  cursor: pointer;
}

.mmw-photo-toggle-btn:hover {
  background: var(--mmw-forest);
  color: #ffffff;
  filter: none;
}

/* Scenic Photo Stage */
.mmw-scenic-stage {
  position: relative;
  flex: 1;
  min-height: 550px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 32px 28px;
  overflow: hidden;
  color: #ffffff;
  isolation: isolate;
}

.mmw-stock-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

@media (prefers-reduced-motion: no-preference) {
  .mmw-visual-card:hover .mmw-stock-photo {
    transform: scale(1.03);
  }
}

.mmw-photo-overlay {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    rgba(8, 24, 21, 0.04) 0%,
    rgba(8, 24, 21, 0.14) 48%,
    rgba(7, 21, 18, 0.68) 80%,
    rgba(6, 18, 16, 0.9) 100%
  );
}

/* Editorial Headline Overlay at Bottom Left of Photo */
.mmw-scenic-content {
  position: relative;
  z-index: 2;
  max-width: 520px;
}

.mmw-scenic-kicker {
  margin: 0 0 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
}

.mmw-scenic-headline {
  margin: 0 0 14px;
  font-family: 'Bricolage Grotesque', 'DM Sans', Arial, sans-serif;
  font-size: clamp(28px, 3.2vw, 38px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.04em;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

.mmw-scenic-location {
  margin: 0;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: rgba(255, 255, 255, 0.96);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

/* ==========================================================================
   RIGHT CARD: "YOUR EXPERIENCE CREATOR" Panel
   ========================================================================== */
.mmw-creator-panel {
  background: var(--mmw-panel-mint);
  border: 1px solid var(--mmw-border-mint);
  border-radius: 6px;
  padding: 28px 24px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.mmw-creator-eyebrow {
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mmw-forest);
}

.mmw-creator-title {
  margin: 0 0 18px;
  font-family: 'Bricolage Grotesque', 'DM Sans', Arial, sans-serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.04em;
  color: var(--mmw-text-main);
}

/* Destination Search Input */
.mmw-field-group {
  margin-block-end: 18px;
  position: relative;
}

.mmw-label {
  display: block;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--mmw-forest);
  margin-block-end: 6px;
}

.mmw-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.mmw-destination-input {
  width: 100%;
  background: #ffffff;
  border: 1px solid var(--mmw-border-input);
  border-radius: 12px;
  padding: 12px 16px;
  font: inherit;
  font-size: max(1rem, 14.5px);
  color: var(--mmw-text-main);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.mmw-destination-input::placeholder {
  color: #7d9690;
}

.mmw-destination-input:focus-visible {
  outline: 2px solid CanvasText;
  outline-offset: 2px;
  border-color: var(--mmw-forest);
}

/* Autocomplete Popover List */
.mmw-dest-dropdown {
  position: absolute;
  inset-block-start: calc(100% + 4px);
  inset-inline: 0;
  z-index: 25;
  background: #ffffff;
  border: 1px solid #cbd5cf;
  border-radius: 8px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  max-height: 240px;
  overflow-y: auto;
}

.mmw-dest-option {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--mmw-text-main);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}

.mmw-dest-option:hover {
  background: #edf3f0;
  filter: none;
}

.mmw-dest-option[aria-selected="true"] {
  background: var(--mmw-forest);
  color: #ffffff;
}

/* Fieldset & 3-Column Pill Grid matching screenshot */
.mmw-fieldset {
  border: 0;
  padding: 0;
  margin: 0 0 16px;
}

.mmw-legend {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--mmw-forest);
  padding: 0;
  margin-block-end: 3px;
}

.mmw-sublegend {
  margin: 0 0 12px;
  font-size: 12px;
  color: var(--mmw-text-muted);
}

.mmw-pills-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px 10px;
}

.mmw-pill-item {
  position: relative;
  display: flex;
}

.mmw-pill-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 7px 12px;
  background: #ffffff;
  border: 1px solid var(--mmw-border-pill);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.2;
  color: var(--mmw-forest);
  cursor: pointer;
  user-select: none;
  transition:
    background-color 0.16s ease,
    border-color 0.16s ease,
    box-shadow 0.16s ease,
    transform 0.18s ease;
}

.mmw-pill-label:hover {
  border-color: #9cb2ab;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

@media (prefers-reduced-motion: no-preference) {
  .mmw-pill-label:hover {
    transform: translateY(-1px);
  }
}

/* Custom Checkbox Box inside Pill */
.mmw-checkbox-box {
  width: 14px;
  height: 14px;
  min-width: 14px;
  border: 1.5px solid #839b95;
  border-radius: 3px;
  background: #ffffff;
  display: inline-grid;
  place-items: center;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.mmw-check-svg {
  width: 9px;
  height: 9px;
  stroke: #ffffff;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 0.14s ease, transform 0.18s ease;
}

/* Checked State with Coral/Terracotta Accent from Screenshot */
.mmw-pill-input:checked + .mmw-pill-label {
  border-color: var(--mmw-coral);
  background: var(--mmw-coral-light);
  color: var(--mmw-text-main);
  box-shadow: 0 2px 8px rgba(200, 107, 72, 0.14);
}

.mmw-pill-input:checked + .mmw-pill-label .mmw-checkbox-box {
  background: var(--mmw-coral);
  border-color: var(--mmw-coral);
}

.mmw-pill-input:checked + .mmw-pill-label .mmw-check-svg {
  opacity: 1;
  transform: scale(1);
}

.mmw-pill-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Notes Textarea matching screenshot */
.mmw-notes-group {
  margin-block-end: 14px;
}

.mmw-textarea {
  width: 100%;
  min-height: 86px;
  padding: 12px 14px;
  font: inherit;
  font-size: max(1rem, 13.5px);
  color: var(--mmw-text-main);
  background: #ffffff;
  border: 1px solid var(--mmw-border-input);
  border-radius: 12px;
  resize: vertical;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.mmw-textarea::placeholder {
  color: #7d9690;
}

.mmw-textarea:focus-visible {
  outline: 2px solid CanvasText;
  outline-offset: 2px;
  border-color: var(--mmw-forest);
}

/* ==========================================================================
   CURATED SUGGESTIONS BOX (Directly Above "Create My Guide" Button)
   ========================================================================== */
.mmw-suggestions-box {
  background: rgba(255, 255, 255, 0.65);
  border: 1px dashed rgba(21, 62, 57, 0.22);
  border-radius: 8px;
  padding: 10px 12px;
  margin-block-end: 16px;
}

.mmw-suggestions-header {
  margin-block-end: 8px;
}

.mmw-suggestions-label {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mmw-forest);
}

.mmw-suggestions-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.mmw-suggestion-chip {
  background: #ffffff;
  border: 1px solid #c7d5cf;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--mmw-text-main);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.mmw-suggestion-chip:hover {
  background: var(--mmw-yellow);
  border-color: var(--mmw-ink);
  color: var(--mmw-ink);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
  filter: none;
}

/* Action buttons — match travelmexico.travel yellow pill CTAs */
.mmw-actions-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-block-end: 12px;
}

button.mmw-btn-primary,
.mmw-btn-primary {
  background: var(--mmw-yellow) !important;
  color: var(--mmw-ink) !important;
  border: 1px solid var(--mmw-ink) !important;
  border-radius: 999px !important;
  padding: 14px 22px !important;
  font-family: 'DM Sans', Arial, sans-serif !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  line-height: 1.2;
  cursor: pointer;
  display: inline-flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  transition: background-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  filter: none !important;
}

.mmw-btn-primary .mmw-btn-arrow {
  font-size: 1.15em;
  line-height: 1;
  font-weight: 700;
}

button.mmw-btn-primary:hover,
.mmw-btn-primary:hover {
  background: #ffffff !important;
  color: var(--mmw-ink) !important;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
  filter: none !important;
}

button.mmw-btn-secondary,
.mmw-btn-secondary {
  background: var(--mmw-forest-btn) !important;
  color: var(--mmw-yellow) !important;
  border: 1px solid var(--mmw-forest-btn) !important;
  border-radius: 999px !important;
  padding: 14px 20px !important;
  font-family: 'DM Sans', Arial, sans-serif !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  line-height: 1.2;
  cursor: pointer;
  display: inline-flex !important;
  align-items: center;
  gap: 8px;
  transition: background-color 160ms ease, color 160ms ease, filter 160ms ease;
  filter: none !important;
  box-shadow: none;
}

button.mmw-btn-secondary:hover,
.mmw-btn-secondary:hover {
  background: var(--mmw-ink) !important;
  color: #ffffff !important;
  filter: none !important;
}

.mmw-footnote {
  margin: 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--mmw-text-muted);
}

.mmw-live-toast {
  margin-block-start: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--mmw-forest);
  min-height: 1.2em;
}

/* ==========================================================================
   EXPANDABLE GUIDE DRAWER (Below the Split Card)
   ========================================================================== */
.mmw-drawer {
  margin-block-start: 24px;
  background: #ffffff;
  border: 1px solid var(--mmw-border-card);
  border-radius: 8px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
  opacity: 1;
  translate: 0 0;
  transition:
    display 0.3s,
    opacity 0.3s ease-out,
    translate 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  transition-behavior: allow-discrete;
}

@starting-style {
  .mmw-drawer {
    opacity: 0;
    translate: 0 16px;
  }
}

.mmw-drawer:where([hidden], [data-closing]) {
  opacity: 0;
  translate: 0 16px;
}

.mmw-drawer[hidden] {
  display: none;
}

.mmw-drawer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-block-end: 14px;
  margin-block-end: 18px;
  border-block-end: 1px solid #ebe7df;
}

.mmw-drawer-title {
  margin: 0 0 4px;
  font-family: 'Bricolage Grotesque', 'DM Sans', Arial, sans-serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--mmw-text-main);
}

.mmw-close-btn {
  background: #ffffff;
  color: var(--mmw-forest);
  border: 1px solid var(--mmw-border-pill);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: 'DM Sans', Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  filter: none;
}

.mmw-close-btn:hover {
  background: var(--mmw-yellow);
  border-color: var(--mmw-ink);
  filter: none;
}

/* Experience Cards Grid */
.mmw-experiences-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-block-end: 22px;
}

.mmw-exp-card {
  background: #ffffff;
  border: 1px solid var(--mmw-border-card);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
}

.mmw-exp-card.is-selected {
  border-color: var(--mmw-forest-btn);
  background: #f7fbf9;
}

.mmw-exp-card h4 {
  margin: 4px 0;
  font-size: 15px;
  color: var(--mmw-text-main);
}

.mmw-exp-desc {
  margin: 0;
  font-size: 13px;

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  }

  function safeNotes(notes) {
    return String(notes || '').trim().slice(0, 1200)
  }

  function moveExperience(ids, id, direction) {
    const i = ids.indexOf(id)
    const next = i + direction
    if (i < 0 || next < 0 || next >= ids.length) return ids
    const copy = ids.slice()
    ;[copy[i], copy[next]] = [copy[next], copy[i]]
    return copy
  }

  function matchingExperiences(catalog, draft) {
    return catalog.experiences.filter(
      (e) =>
        e.destinationId === draft.destinationId &&
        (e.kind === 'editorial-block' || !draft.interests.length || e.interests.some((i) => draft.interests.includes(i)))
    )
  }

  function selectedExperiences(catalog, draft) {
    const map = new Map(catalog.experiences.filter((e) => e.destinationId === draft.destinationId).map((e) => [e.id, e]))
    return draft.experienceIds.flatMap((id) => (map.has(id) ? [map.get(id)] : []))
  }

  function recommendationReason(e, interests, locale) {
    if (e.kind === 'editorial-block') {
      return locale === 'es'
        ? 'Bloque editorial flexible. No es una actividad contratada ni una coincidencia verificada con tus intereses.'
        : 'Flexible editorial block. Not a booked activity or a verified match to your interests.'
    }
    const matches = e.interests.filter((i) => interests.includes(i)).map((i) => interestLabels[i]?.[locale] || i)
    return matches.length
      ? (locale === 'es' ? 'Coincide con: ' : 'Matches: ') + matches.join(', ')
      : locale === 'es'
        ? 'Experiencia del destino seleccionado.'
        : 'Experience in your selected destination.'
  }

  function normalizeDraft(value, catalog) {
    if (!value || typeof value !== 'object') throw new Error('Invalid draft')
    if (value.version !== 2 || typeof value.destinationId !== 'string' || !catalog.destinations.some((d) => d.id === value.destinationId)) {
      throw new Error('Invalid draft destination or version')
    }
    const unique = (x) => (Array.isArray(x) ? [...new Set(x.filter((i) => typeof i === 'string'))] : [])
    const validIds = new Set(catalog.experiences.filter((e) => e.destinationId === value.destinationId).map((e) => e.id))
    return {
      version: 2,
      destinationId: value.destinationId,
      interests: unique(value.interests).filter((i) => Object.prototype.hasOwnProperty.call(interestLabels, i)),
      experienceIds: unique(value.experienceIds).filter((i) => validIds.has(i)).slice(0, 40),
      notes: safeNotes(typeof value.notes === 'string' ? value.notes : ''),
    }
  }

  /* --- Itinerary simulation (local deterministic) --- */
  function validateItineraryRequest(value, catalog) {
    const fail = (m) => {
      throw new Error(m)
    }
    if (value.version !== 1) fail('UNSUPPORTED_VERSION')
    if (!['es', 'en'].includes(value.locale)) fail('UNSUPPORTED_LOCALE')
    const destination = catalog.destinations.find((d) => d.id === value.destinationId && d.sourced)
    if (!destination) fail('DESTINATION_NOT_IN_REVIEWED_CATALOG')
    if (!Number.isInteger(value.days) || value.days < 1 || value.days > 14) fail('DAYS_OUT_OF_RANGE')
    if (!['slow', 'balanced', 'active'].includes(value.pace)) fail('INVALID_PACE')
    if (!Array.isArray(value.interests) || value.interests.length > 8) fail('INVALID_INTERESTS')
    const known = new Set(catalog.experiences.filter((e) => e.destinationId === value.destinationId).flatMap((e) => e.interests))
    if (value.interests.some((i) => !known.has(i))) fail('INTEREST_NOT_IN_CATALOG')
    return {
      version: 1,
      locale: value.locale,
      destinationId: destination.id,
      days: value.days,
      pace: value.pace,
      interests: [...new Set(value.interests)],
    }
  }

  function validateItineraryResponse(value, request, catalog) {
    const fail = (m) => {
      throw new Error(m)
    }
    if (value.version !== 1 || value.destinationId !== request.destinationId) fail('RESPONSE_MISMATCH')
    if (!Array.isArray(value.days) || value.days.length !== request.days) fail('INVALID_DAY_COUNT')
    const selected = new Set()
    const max = request.pace === 'slow' ? 2 : request.pace === 'balanced' ? 3 : 4
    const days = value.days.map((day, i) => {
      if (day.day !== i + 1 || !Array.isArray(day.items) || day.items.length > max) fail('INVALID_DAY_OR_PACE')
      return {
        day: i + 1,
        items: day.items.map((item) => {
          if (!['interest-match', 'destination-context'].includes(item.reason)) fail('UNSUPPORTED_REASON')
          const entry = catalog.experiences.find((e) => e.id === item.catalogId && e.destinationId === request.destinationId)
          if (!entry || selected.has(entry.id)) fail('UNKNOWN_OR_DUPLICATE_ITEM')
          selected.add(entry.id)
          if (item.reason === 'interest-match' && !entry.interests.some((x) => request.interests.includes(x))) fail('UNSUPPORTED_INTEREST_MATCH')
          return {
            catalogId: entry.id,
            kind: entry.kind || 'verified-experience',
            title: entry.title,
            description: entry.description,
            reason: item.reason,
            sources: entry.sources.map((s) => ({ ...s })),
            checkedOn: entry.checkedOn,
            checks: [...entry.checks],
            coverageGaps: entry.coverageGaps,
          }
        }),
      }
    })
    if (!selected.size) fail('EMPTY_PLAN')
    return {
      version: 1,
      destinationId: request.destinationId,
      locale: request.locale,
      status: 'validated-structure-not-operationally-verified',
      days,
      limits: { availabilityVerified: false, transportCalculated: false, bookingCreated: false, preferencesTransferred: false },
      globalCheck: catalog.globalCheck,
    }
  }

  function simulateItinerary(input, selection, catalog) {
    const request = validateItineraryRequest(input, catalog)
    if (!Array.isArray(selection) || !selection.length) throw new Error('SELECT_ITEMS_FIRST')
    if (new Set(selection).size !== selection.length) throw new Error('DUPLICATE_SELECTION')
    const cap = { slow: 2, balanced: 3, active: 4 }[request.pace]
    if (selection.length > request.days * cap) throw new Error('SELECTION_EXCEEDS_CAPACITY')
    const days = Array.from({ length: request.days }, (_, i) => ({ day: i + 1, items: [] }))
    selection.forEach((id, i) => {
      const entry = catalog.experiences.find((e) => e.id === id && e.destinationId === request.destinationId)
      if (!entry) throw new Error('INVALID_SELECTION')
      days[Math.floor(i / cap)].items.push({
        catalogId: id,
        reason: entry.interests.some((x) => request.interests.includes(x)) ? 'interest-match' : 'destination-context',
      })
    })
    return {
      mode: 'local-deterministic-simulation-not-ai',
      ...validateItineraryResponse({ version: 1, destinationId: request.destinationId, days }, request, catalog),
    }
  }

  function buildDisplayDays(result, draft, days, pace, locale, destinationTitle) {
    if (!result) return null
    const selectedEntries = []
    result.days.forEach((d) => d.items.forEach((item) => selectedEntries.push(item)))
    const availableInterests =
      draft.interests.length > 0
        ? draft.interests
        : ['Nature & landscapes', 'Food & flavours', 'Beaches', 'Water activities', 'Culture & traditions', 'Adventure']
    const simulatedDays = []
    let entryIdx = 0
    let interestIdx = 0
    for (let dayNum = 1; dayNum <= days; dayNum++) {
      const items = []
      if (entryIdx < selectedEntries.length) {
        items.push(selectedEntries[entryIdx++])
        if (pace !== 'slow' && selectedEntries.length > days && entryIdx < selectedEntries.length) {
          items.push(selectedEntries[entryIdx++])
        }
      } else {
        const interest = availableInterests[interestIdx++ % availableInterests.length]
        items.push(getPlannedInterestActivity(destinationTitle, interest, dayNum, locale))
      }
      simulatedDays.push({ day: dayNum, items })
    }
    return simulatedDays
  }

  function initDraftForLocale() {
    const cat = catalog()
    const defaultDest = cat.destinations.find((d) => d.id === 'san-quintin') || cat.destinations[0]
    const experienceIds = cat.experiences.filter((e) => e.destinationId === defaultDest.id).map((e) => e.id)
    state.draft = {
      version: 2,
      destinationId: defaultDest.id,
      interests: [],
      experienceIds,

    }
    state.extraInterests = []
    state.destinationQuery = defaultDest.title
    state.customTypedDestination = ''
    state.dropdownOpen = false
    state.guideOpen = false
    state.toast = ''
    state.showAllPills = false
    state.simResult = null
    state.simError = ''
    state.simSignature = ''
  }

  function announce(esMsg, enMsg) {
    state.toast = state.locale === 'es' ? esMsg : enMsg
  }

  function activeDestination() {
    return catalog().destinations.find((d) => d.id === state.draft.destinationId) || catalog().destinations[0]
  }

  function normalizedInput() {
    const raw = state.customTypedDestination || state.destinationQuery
    if (!raw) return ''
    return raw
      .toLowerCase()
      .trim()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
  }

  function mediaConfig() {
    const dest = activeDestination()
    const norm = normalizedInput()
    return (
      (dest && DESTINATION_MEDIA[dest.id]) ||
      (norm && DESTINATION_MEDIA[norm]) ||
      DESTINATION_MEDIA[state.draft.destinationId] ||
      DESTINATION_MEDIA['san-quintin'] ||
      DESTINATION_MEDIA.default
    )
  }

  function selectDestination(destId) {
    const found = catalog().destinations.find((d) => d.id === destId)
    if (!found) return
    const destExps = catalog().experiences.filter((e) => e.destinationId === found.id).map((e) => e.id)
    state.draft = { ...state.draft, destinationId: found.id, experienceIds: destExps }
    state.destinationQuery = found.title
    state.customTypedDestination = ''
    state.dropdownOpen = false
    state.simResult = null
    announce(`Destino actualizado a ${found.title}.`, `Destination updated to ${found.title}.`)
    render()
  }

  function restoreField(id, value, start, end) {
    const el = document.getElementById(id)
    if (!el) return
    el.focus()
    if (typeof value === 'string' && el.value !== value) el.value = value
    if (typeof start === 'number' && typeof end === 'number') {
      try {
        el.setSelectionRange(start, end)
      } catch (_) {}
    }
  }

  function handleInputChange(value, caret) {
    state.destinationQuery = value
    state.dropdownOpen = true
    const trimmed = value.trim().toLowerCase()
    if (!trimmed) {
      state.customTypedDestination = ''
      render()
      restoreField('mmw-dest-input', value, caret?.start, caret?.end)
      return
    }
    const matched = catalog().destinations.find((d) => d.title.toLowerCase() === trimmed || d.id.toLowerCase() === trimmed)
    if (matched && matched.id !== state.draft.destinationId) {
      selectDestination(matched.id)
      restoreField('mmw-dest-input', state.destinationQuery, caret?.start, caret?.end)
    } else if (!matched) {
      state.customTypedDestination = value.trim()
      render()
      restoreField('mmw-dest-input', value, caret?.start, caret?.end)
    } else {
      state.customTypedDestination = ''
      render()
      restoreField('mmw-dest-input', value, caret?.start, caret?.end)
    }
  }

  function applySuggestion(sug) {
    const targetDest = catalog().destinations.find((d) => d.id === sug.destinationId)
    const destId = targetDest?.id || sug.destinationId
    const matchingExpIds = catalog().experiences.filter((e) => e.destinationId === destId).map((e) => e.id)
    state.draft = {
      ...state.draft,
      destinationId: destId,
      interests: sug.interests.slice(),
      notes: sug.notes[state.locale],
      experienceIds: matchingExpIds,
    }
    state.destinationQuery = targetDest?.title || sug.destinationQuery
    state.customTypedDestination = ''
    state.dropdownOpen = false
    state.simResult = null
    announce(`Sugerencia aplicada: ${sug.label[state.locale]}`, `Suggestion applied: ${sug.label[state.locale]}`)
    render()
  }

  function togglePill(option) {
    if (option.catalogInterest && Object.prototype.hasOwnProperty.call(interestLabels, option.catalogInterest)) {
      const key = option.catalogInterest
      const interests = state.draft.interests.includes(key)
        ? state.draft.interests.filter((x) => x !== key)
        : [...state.draft.interests, key]
      state.draft = { ...state.draft, interests }
    } else {
      state.extraInterests = state.extraInterests.includes(option.id)
        ? state.extraInterests.filter((x) => x !== option.id)
        : [...state.extraInterests, option.id]
    }
    render()
  }

  function createGuide() {
    const displayed = getDisplayedExperiences()
    if (state.draft.experienceIds.length === 0 && displayed.length > 0) {
      state.draft = { ...state.draft, experienceIds: displayed.slice(0, 4).map((m) => m.id) }
    }
    state.guideOpen = true
    const dest = activeDestination()
    announce(
      `Guía creada para ${dest?.title || state.destinationQuery || ''}.`,
      `Guide created for ${dest?.title || state.destinationQuery || ''}.`
    )
    render()
    setTimeout(() => {
      document.getElementById('mmw-drawer')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }, 80)
  }

  function openMarisol() {
    state.guideOpen = true
    announce(
      'Marisol: He preparado sugerencias verificadas y la simulación interactiva abajo.',
      'Marisol: I have prepared verified suggestions and the interactive simulation below.'
    )
    render()
    setTimeout(() => {
      document.getElementById('mmw-drawer')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }, 50)
  }

  function getDisplayedExperiences() {
    const all = catalog().experiences.filter((e) => e.destinationId === state.draft.destinationId)
    const strict = matchingExperiences(catalog(), state.draft)
    return strict.length > 0 ? strict : all
  }

  function currentSimSignature() {
    return JSON.stringify([
      state.draft.destinationId,
      state.draft.experienceIds,
      state.draft.interests,
      state.simDays,
      state.simPace,
      state.locale,
    ])
  }

  function runSimulation() {
    try {
      const supported = new Set(
        catalog()
          .experiences.filter((e) => e.destinationId === state.draft.destinationId)
          .flatMap((e) => e.interests)
      )
      const out = simulateItinerary(
        {
          version: 1,
          locale: state.locale,
          destinationId: state.draft.destinationId,
          days: state.simDays,
          pace: state.simPace,
          interests: state.draft.interests.filter((i) => supported.has(i)).slice(0, 8),
        },
        state.draft.experienceIds,
        catalog()
      )
      state.simResult = out
      state.simSignature = currentSimSignature()
      state.simError = ''
    } catch (e) {
      state.simResult = null
      const code = e instanceof Error ? e.message : ''
      const es = state.locale === 'es'
      state.simError =
        code === 'SELECT_ITEMS_FIRST'
          ? es
            ? 'Selecciona al menos una ficha antes de simular.'
            : 'Select at least one entry before simulating.'
          : code === 'SELECTION_EXCEEDS_CAPACITY'
            ? es
              ? 'Tu selección supera la capacidad de esta demostración. Aumenta días o reduce la selección; no se omitió ninguna ficha.'
              : 'Your selection exceeds this demonstration’s capacity. Add days or reduce the selection; no entries were omitted.'
            : es
              ? 'No se puede simular con esta selección o destino. Revisa cobertura, días y fichas.'
              : 'This selection or destination cannot be simulated. Check coverage, days and entries.'
    }
    render()
  }

    const displayDays = buildDisplayDays(

      dest?.title || state.draft.destinationId

    }

    return `<section aria-label="${es ? 'Simulación local de itinerario' : 'Local itinerary simulation'}" class="itinerary-simulation sim-card">

        <div class="mmw-actions-row mmw-actions-inline">
          <button type="submit" class="mmw-btn-primary"><span>${es ? 'Crear mi guía' : 'Create my guide'}</span><span class="mmw-btn-arrow" aria-hidden="true">↗</span></button>
          <button type="button" class="mmw-btn-secondary" data-action="open-marisol">${es ? 'Hablar con Marisol' : 'Talk to Marisol'}</button>
        </div>

        <p class="mmw-footnote">${
          es
            ? 'Ingresa cualquier destino en México. Empieza con tus preferencias; este piloto cuenta con sugerencias verificadas con fuentes para ocho destinos de Baja California. La IA no está conectada.'
            : 'Enter any destination in México. Start with your preferences; this pilot has source-based suggestions for eight Baja California destinations. AI is not connected.'
        }</p>
        <p class="mmw-live-toast" role="status" aria-live="polite">${escapeHTML(state.toast)}</p>
      </form>
    </div>
  </div>

  <div class="mmw-sticky-cta" role="region" aria-label="${es ? 'Acciones rápidas' : 'Quick actions'}">
    <button type="button" class="mmw-btn-secondary mmw-sticky-secondary" data-action="open-marisol">Marisol</button>
    <button type="button" class="mmw-btn-primary mmw-sticky-primary" data-action="create-guide"><span>${es ? 'Crear mi guía' : 'Create my guide'}</span><span class="mmw-btn-arrow" aria-hidden="true">↗</span></button>
  </div>

  <section id="mmw-drawer" class="mmw-drawer" ${state.guideOpen ? '' : 'hidden'} aria-label="${es ? 'Tu guía de viaje' : 'Your travel guide'}">
    <div class="mmw-drawer-header">
      <div>
        <p class="mmw-visual-eyebrow" style="margin:0 0 4px;color:#08433b">${
          es
            ? `TU GUÍA PERSONALIZADA · ${escapeHTML((dest?.title || '').toUpperCase())}`
            : `YOUR PERSONALIZED GUIDE · ${escapeHTML((dest?.title || '').toUpperCase())}`
        }</p>
        <h3 class="mmw-drawer-title">${
          es
            ? `Experiencias verificadas en ${escapeHTML(dest?.title || '')}`
            : `Verified experiences in ${escapeHTML(dest?.title || '')}`
        }</h3>
        <p style="margin:0;font-size:13px;color:#617b75;line-height:1.45">${escapeHTML(dest?.coverage || '')}</p>
      </div>
      <button type="button" class="mmw-close-btn" data-action="close-guide">${es ? 'Ocultar vista previa ✕' : 'Hide preview ✕'}</button>
    </div>
    <div class="mmw-experiences-grid">${expCards}</div>
    ${renderSimulation(es, dest)}
    <div class="mmw-toolbar">
      <button type="button" class="mmw-toolbar-btn primary" data-action="download-guide">${es ? 'Descargar Guía (HTML)' : 'Download Guide (HTML)'} ↘</button>
      <span style="font-size:13px;font-weight:600;color:#153e39;margin-inline-start:auto">${selected.length} ${
        es ? 'experiencias seleccionadas' : 'experiences selected in your guide'
      }</span>
    </div>
  </section>
</section>`
  }

  function onMainClick(e) {
    const t = e.target.closest('[data-action]')
    if (!t) return
    const action = t.getAttribute('data-action')
    if (action === 'open-marisol') {
      e.preventDefault()
      openMarisol()
    } else if (action === 'create-guide') {
      e.preventDefault()
      createGuide()
    } else if (action === 'close-guide') {
      state.guideOpen = false
      render()
    } else if (action === 'select-dest') {
      selectDestination(t.getAttribute('data-dest-id'))
    } else if (action === 'apply-sug') {
      const sug = CURATED_SUGGESTIONS.find((s) => s.id === t.getAttribute('data-sug-id'))
      if (sug) applySuggestion(sug)
    } else if (action === 'toggle-pills') {
      state.showAllPills = !state.showAllPills
      render()
    } else if (action === 'toggle-exp') {
      const expId = t.getAttribute('data-exp-id')
      const ids = state.draft.experienceIds.includes(expId)
        ? state.draft.experienceIds.filter((x) => x !== expId)
        : [...state.draft.experienceIds, expId]
      state.draft = { ...state.draft, experienceIds: ids }
      render()
    } else if (action === 'move-exp') {
      const expId = t.getAttribute('data-exp-id')
      const dir = Number(t.getAttribute('data-dir'))
      state.draft = { ...state.draft, experienceIds: moveExperience(state.draft.experienceIds, expId, dir) }
      render()
    } else if (action === 'download-guide') {
      try {
        downloadGuideHTML(state.locale, state.draft, catalog())
        announce('Guía HTML descargada correctamente.', 'HTML guide downloaded successfully.')
      } catch {
        announce('No se pudo generar la guía.', 'Unable to generate the guide.')
      }
      render()
    } else if (action === 'sim-days-dec') {
      state.simDays = Math.max(1, state.simDays - 1)
      render()
    } else if (action === 'sim-days-inc') {
      state.simDays = Math.min(14, state.simDays + 1)
      render()
    } else if (action === 'sim-run') {
      runSimulation()
    } else if (action === 'adjust-days') {
      state.simDays = Number(t.getAttribute('data-days')) || state.simDays
      render()
    }
  }

  function onMainChange(e) {
    const t = e.target
    const action = t.getAttribute('data-action')
    if (action === 'notes') {
      state.draft = { ...state.draft, notes: t.value.slice(0, 1200) }
    } else if (action === 'sim-pace') {
      state.simPace = t.value
      render()
    } else if (action === 'sim-days-input') {
      const val = parseInt(t.value, 10)
      if (!isNaN(val)) state.simDays = Math.max(1, Math.min(14, val))
      else if (t.value === '') state.simDays = 1
      render()
    } else if (action === 'toggle-pill') {
      const option = EXPERIENCE_OPTIONS.find((o) => o.id === t.getAttribute('data-pill-id'))
      if (option) togglePill(option)
    }
  }

  function onMainInput(e) {
    const t = e.target
    if (t.getAttribute('data-action') === 'dest-input') {
      handleInputChange(t.value, { start: t.selectionStart, end: t.selectionEnd })
    } else if (t.getAttribute('data-action') === 'notes') {
      state.draft = { ...state.draft, notes: t.value.slice(0, 1200) }
    }
  }

  function onMainSubmit(e) {
    if (e.target.id === 'mmw-experience-form') {
      e.preventDefault()
      createGuide()
    }
  }

  document.getElementById('main').addEventListener('click', onMainClick)
  document.getElementById('main').addEventListener('change', onMainChange)
  document.getElementById('main').addEventListener('input', onMainInput)
  document.getElementById('main').addEventListener('submit', onMainSubmit)
  document.getElementById('main').addEventListener('focusin', (e) => {
    if (e.target.getAttribute('data-action') === 'dest-input' && !state.dropdownOpen) {
      state.dropdownOpen = true
      const val = e.target.value
      const start = e.target.selectionStart
      const end = e.target.selectionEnd
      render()
      const input = document.getElementById('mmw-dest-input')
      if (input) {
        input.focus()
        input.value = val
        try {
          input.setSelectionRange(start, end)
        } catch (_) {}
      }
    }
  })

  document.addEventListener('mousedown', (e) => {
    const box = document.getElementById('mmw-combobox')
    if (box && !box.contains(e.target) && state.dropdownOpen) {
      state.dropdownOpen = false
      render()
    }
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.dropdownOpen) {
      state.dropdownOpen = false
      render()
    }
  })

  initDraftForLocale()
  render()
})()

</script>
</body>
</html>
